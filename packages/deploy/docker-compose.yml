# Canonical standalone Cortex. Every resource is scoped by the Compose project.
# TLS exists before initdb; finite migrations finish before API writers start.
x-build-args: &build-args
  KOS_VERSION: ${CORTEX_VERSION:?set CORTEX_VERSION}
  KOS_SOURCE_REVISION: ${CORTEX_SOURCE_REVISION:?set CORTEX_SOURCE_REVISION}
  KOS_IMAGE_SOURCE: https://github.com/Kaidera-AI/cortex
  KOS_EDITION: open-source
x-runtime: &runtime
  userns_mode: keep-id:uid=10001,gid=10001
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,mode=1777']
  networks: [cortex-net]
x-api-env: &api-env
  CORTEX_DB_AUTH: certificate
  CORTEX_PG_DSN: postgresql://postgres@cortex-pg:5432/platform_agent_memory
  CORTEX_PG_DSN_ADMIN: postgresql://postgres@cortex-pg:5432/platform_agent_memory
  CORTEX_PG_DSN_APP: postgresql://cortex_app@cortex-pg:5432/platform_agent_memory
  CORTEX_MIGRATIONS_DIR: /app/migrations
  CORTEX_EVENT_BACKEND: postgres
  CORTEX_REQUIRE_RLS: '1'
  CORTEX_ADMIN_TOKEN: ${CORTEX_ADMIN_TOKEN:?generated by cortex-runtime}
  CORTEX_SURFACE_VERSION: cortex-standalone-${CORTEX_VERSION}
  CORTEX_GRAPH_WORKER_URL: http://cortex-graph-worker:9001
  CORTEX_EMBED_WORKER_URL: http://cortex-embed-worker:9005
  CORTEX_PDF_WORKER_URL: http://cortex-pdf-worker:9004
  CORTEX_EMBED_PROVIDER: local
  CORTEX_EMBED_MODEL: sentence-transformers/all-mpnet-base-v2
  CORTEX_RERANK_PROVIDER: local
  CORTEX_RERANK_MODEL: cross-encoder/ms-marco-MiniLM-L6-v2
  OPENKAI_PROVIDER_STATUS_URL: http://cortex-provider:8767/provider-config
  HARNESS_SERVICE_TOKEN: ${HARNESS_SERVICE_TOKEN:?runtime prepares provider status}

services:
  cortex-tls-init:
    userns_mode: keep-id:uid=10001,gid=10001
    build: {context: ./tls, dockerfile: Containerfile, args: *build-args}
    image: localhost/cortex/tls:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    restart: 'no'
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,mode=1777']
    volumes:
      - cortex-ca:/tls/ca
      - cortex-tls-server:/tls/server
      - cortex-tls-app:/tls/app
      - cortex-tls-admin:/tls/admin

  cortex-pg:
    userns_mode: keep-id:uid=10001,gid=10001
    build: {context: .., dockerfile: deploy/Containerfile.db, args: *build-args}
    image: localhost/cortex/db:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    # Upstream bootstrap drops to postgres after assigning its volume ownership.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=3775
    shm_size: 256m
    environment: {POSTGRES_USER: postgres, POSTGRES_DB: platform_agent_memory}
    depends_on: {cortex-tls-init: {condition: service_completed_successfully}}
    volumes:
      - cortex-pg-data:/var/lib/postgresql
      - cortex-tls-server:/tls/server:ro
    networks: [cortex-net]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, platform_agent_memory]
      interval: 5s
      timeout: 3s
      retries: 30

  cortex-migrate:
    <<: *runtime
    build: {context: ../api, args: *build-args}
    image: localhost/cortex/api:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    restart: 'no'
    command: [python, /app/standalone/migrate.py]
    environment: *api-env
    depends_on: {cortex-pg: {condition: service_healthy}}
    volumes:
      - cortex-tls-admin:/tls/admin:ro
      - ../schema/migrations:/app/migrations:ro

  cortex-provider:
    <<: *runtime
    build: {context: ., dockerfile: Containerfile.provider, args: *build-args}
    image: localhost/cortex/provider:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    volumes:
      - ${CORTEX_PROVIDER_AUTHORITY_DIR:?runtime validates shared authority}:/authority:ro
      - ${CORTEX_PROVIDER_PROJECTION_DIR:?runtime prepares projection}:/authority/kos-cortex-provider
      - ${CORTEX_PROVIDER_AUTHORITY_DIR}/.env.lock:/authority/.env.lock
      - ${CORTEX_PROVIDER_TOKEN_FILE:?runtime prepares private token}:/run/cortex-provider/token:ro
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import urllib.request; token=Path('/run/cortex-provider/token').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://localhost:8767/provider-config',headers={'Authorization':'Bearer '+token}),timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30

  cortex-api:
    <<: *runtime
    image: localhost/cortex/api:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    environment: *api-env
    depends_on:
      cortex-migrate: {condition: service_completed_successfully}
      cortex-provider: {condition: service_healthy}
    ports: ['127.0.0.1:${CORTEX_API_PORT:-8501}:8501']
    volumes:
      - cortex-tls-app:/tls/app:ro
      - cortex-tls-admin:/tls/admin:ro
      - ../schema/migrations:/app/migrations:ro
      - ${CORTEX_PROVIDER_PROJECTION_DIR}:/run/openkai-provider:ro
      - ${CORTEX_PROVIDER_REGISTRY_FILE:?runtime validates registry}:/run/openkai-registry.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30

  cortex-embed-worker:
    <<: *runtime
    build: {context: ../containers/embed-worker, args: *build-args}
    image: localhost/cortex/embed-worker:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    depends_on: {cortex-api: {condition: service_healthy}}
    volumes: [cortex-models:/home/kaidera/.cache]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9005/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 90

  cortex-graph-worker:
    <<: *runtime
    build: {context: ../containers/graph-worker, args: *build-args}
    image: localhost/cortex/graph-worker:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    depends_on: {cortex-api: {condition: service_healthy}}
    volumes: [cortex-graphs:/var/lib/cortex/graphs, cortex-models:/home/kaidera/.cache]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9001/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 60

  cortex-pdf-worker:
    <<: *runtime
    build: {context: ../containers/pdf-worker, args: *build-args}
    image: localhost/cortex/pdf-worker:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    depends_on: {cortex-api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9004/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 60

  cortex-backup:
    image: localhost/cortex/db:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    profiles: [maintenance]
    user: '0:0'
    userns_mode: keep-id:uid=10001,gid=10001
    entrypoint: [/bin/bash, /backup-tools/backup-db.sh]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    environment:
      PGHOST: cortex-pg
      PGUSER: postgres
      PGDATABASE: platform_agent_memory
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tls/admin/ca.crt
      PGSSLCERT: /tls/admin/tls.crt
      PGSSLKEY: /tls/admin/tls.key
    networks: [cortex-net]
    volumes:
      - ./backup-db.sh:/backup-tools/backup-db.sh:ro
      - ./tls/init.sh:/backup-tools/tls-init.sh:ro
      - ${CORTEX_BACKUP_STAGE:?runtime manages backup staging}:/backup
      - cortex-ca:/tls/ca:ro
      - cortex-tls-server:/tls/server:ro
      - cortex-tls-app:/tls/app:ro
      - cortex-tls-admin:/tls/admin:ro

  cortex-pki-restore:
    image: localhost/cortex/db:${CORTEX_VERSION}-${CORTEX_SOURCE_REVISION}
    profiles: [maintenance]
    user: '0:0'
    userns_mode: keep-id:uid=10001,gid=10001
    entrypoint: [/bin/bash, /backup-tools/backup-db.sh]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    volumes:
      - ./backup-db.sh:/backup-tools/backup-db.sh:ro
      - ./tls/init.sh:/backup-tools/tls-init.sh:ro
      - ${CORTEX_BACKUP_STAGE:?runtime manages backup staging}:/backup:ro
      - cortex-ca:/tls/ca
      - cortex-tls-server:/tls/server
      - cortex-tls-app:/tls/app
      - cortex-tls-admin:/tls/admin

networks:
  cortex-net: {}
volumes:
  cortex-pg-data: {}
  cortex-ca: {}
  cortex-tls-server: {}
  cortex-tls-app: {}
  cortex-tls-admin: {}
  cortex-models: {}
  cortex-graphs: {}
