name: ci
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
jobs:
  pytest-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
      - name: bounded locked dependencies
        run: |
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            python -m pip install --only-binary=:all: --require-hashes \
            -r packages/api/requirements.lock --target "${{ runner.temp }}/cortex-pg-site"
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            python -m pip install --only-binary=:all: pytest==8.4.2 pytest-asyncio==1.2.0 \
            psycopg2-binary==2.9.11 PyYAML==6.0.3 --target "${{ runner.temp }}/cortex-pg-site"
      - name: fail-capable pytest gate controls
        run: |
          PYTHONPATH="${{ runner.temp }}/cortex-pg-site" \
            python .github/scripts/pytest_pg_gate_checks.py --output "${{ runner.temp }}/cortex-pytest-pg/gate"
      - name: rootless PG contract (51 tests; cold and warm; no skips or deselections)
        run: |
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            python .github/scripts/pytest_pg.py --output "${{ runner.temp }}/cortex-pytest-pg" \
            --site "${{ runner.temp }}/cortex-pg-site"
      - name: U13 pinned test driver and exact-node gate controls
        run: |
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            python -m pip install --only-binary=:all: --no-deps psycopg==3.2.9 \
            --target "${{ runner.temp }}/cortex-pg-site"
          python -B .github/scripts/tests/test_u13_gate.py
      - name: U13 isolated current-v2 PostgreSQL (eight exact methods)
        run: |
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            python .github/scripts/pytest_u13_pg.py --output "${{ runner.temp }}/cortex-u13-pg" \
            --site "${{ runner.temp }}/cortex-pg-site" --control mutant
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: u13-pg-receipts
          path: |
            ${{ runner.temp }}/cortex-u13-pg/**/*.json
            ${{ runner.temp }}/cortex-u13-pg/**/*.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-pg-receipts
          path: |
            ${{ runner.temp }}/cortex-pytest-pg/**/*.json
            ${{ runner.temp }}/cortex-pytest-pg/**/*.txt
          if-no-files-found: warn
          retention-days: 7
  pytest-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
      - name: locked API and test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packages/api/requirements.lock
          python -m pip install --only-binary=:all: pytest==8.4.2 pytest-asyncio==1.2.0
      - name: offline Python contract (145 tests; no skips or deselections)
        run: python .github/scripts/pytest_offline.py --output "${{ runner.temp }}/cortex-pytest-offline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-offline-receipts
          path: |
            ${{ runner.temp }}/cortex-pytest-offline/*.json
            ${{ runner.temp }}/cortex-pytest-offline/*.txt
          if-no-files-found: warn
  launcher-contract:
    # One launcher behind every channel means one behavioural contract, proven under both
    # runtimes on every change. The runner is NOT a compliant Cortex host, so the gate
    # tests the CONTRACT (exit codes, JSON shape, honest refusal), never host compliance.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: contract checks
        shell: bash
        run: |
          set -u
          RT=${{ matrix.runtime }}
          CLI="packages/installer/bin/cortex.js"
          run() { "$RT" "$CLI" "$@"; }

          # version + help exit 0
          run version
          run help

          # install refuses with exit 2 and names what is pending (never a partial deploy)
          set +e; out=$(run install 2>&1); rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "install must exit 2 pre-payload, got $rc"; exit 1; }
          grep -q "REFUSED" <<<"$out" || { echo "install refusal must be loud"; exit 1; }

          # rollback carries the same refusal pre-payload
          set +e; out=$(run install --rollback 2>&1); rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "rollback must exit 2 pre-payload, got $rc"; exit 1; }

          # preflight --json always yields valid JSON with the contract shape;
          # its exit code reflects the RUNNER's compliance and is not asserted.
          set +e; run preflight --json > preflight.json; set -e
          python3 - <<'PY'
          import json
          d = json.load(open("preflight.json"))
          assert isinstance(d["ok"], bool) and isinstance(d["checks"], list) and d["checks"]
          for c in d["checks"]:
              assert set(c) >= {"name", "ok", "detail"}
              if not c["ok"]:
                  assert c.get("remedy"), f"failing check without remedy: {c['name']}"
          print("preflight JSON contract ok:", len(d["checks"]), "checks")
          PY
