name: next-offline
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
jobs:
  next-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13.7', '3.14.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: hashed source-contract test dependencies
        run: |
          python -m venv "${{ runner.temp }}/next-offline-venv"
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            "${{ runner.temp }}/next-offline-venv/bin/python" -m pip install \
            --only-binary=:all: --require-hashes -r packages/api/requirements.lock \
            -r next/requirements-ci-test.lock
          # Source-contract tests retain U3's exact accepted provider version.
          # Production API lock stays unchanged; all suites share this one venv.
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            "${{ runner.temp }}/next-offline-venv/bin/python" -m pip install \
            --only-binary=:all: --require-hashes --no-deps -r .github/next-offline-requirements.lock
          "${{ runner.temp }}/next-offline-venv/bin/python" -m pip check
          mkdir -p "${{ runner.temp }}/next-offline-receipts"
          "${{ runner.temp }}/next-offline-venv/bin/python" -m pip freeze --all \
            > "${{ runner.temp }}/next-offline-receipts/dependencies.txt"
      - name: pinned source-signing tool
        run: |
          set -euo pipefail
          # Keep /usr/bin tool-free for the suite's explicit missing-tool case.
          ! PATH=/usr/bin:/bin command -v minisign
          mkdir -p "${{ runner.temp }}/next-offline-tools/bin" "${{ runner.temp }}/next-offline-receipts"
          archive="${{ runner.temp }}/minisign-0.12-linux.tar.gz"
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz --output "$archive"
          printf '%s  %s\n' 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73 "$archive" \
            | shasum -a 256 --check --strict | tee "${{ runner.temp }}/next-offline-receipts/minisign-archive.txt"
          tar -xzf "$archive" -C "${{ runner.temp }}/next-offline-tools/bin" --strip-components=2 minisign-linux/x86_64/minisign
          chmod 755 "${{ runner.temp }}/next-offline-tools/bin/minisign"
          version="$("${{ runner.temp }}/next-offline-tools/bin/minisign" -v)"
          test "$version" = 'minisign 0.12'
          printf '%s\n' "$version" > "${{ runner.temp }}/next-offline-receipts/minisign-version.txt"
          shasum -a 256 "${{ runner.temp }}/next-offline-tools/bin/minisign" \
            > "${{ runner.temp }}/next-offline-receipts/minisign-binary.txt"
      - name: frozen inventory and outcome oracles
        env:
          CORTEX_NEXT_ORACLE_OUTPUT: ${{ runner.temp }}/next-offline-receipts/strictness-controls
        run: |
          "${{ runner.temp }}/next-offline-venv/bin/python" -B .github/scripts/tests/test_next_offline_gate.py
      - name: every admitted next suite without IP networking or native services
        run: |
          sudo systemd-run --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE" \
            -p PrivateNetwork=yes -p RestrictAddressFamilies=AF_UNIX -p NoNewPrivileges=yes \
            -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            /usr/bin/env PATH="${{ runner.temp }}/next-offline-tools/bin:${{ runner.temp }}/next-offline-venv/bin:/usr/bin:/bin" \
            "${{ runner.temp }}/next-offline-venv/bin/python" -B \
            .github/scripts/pytest_next_offline.py --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --output "${{ runner.temp }}/next-offline-receipts"
      - name: required helper and seed source loopback home
        if: ${{ !cancelled() }}
        run: |
          sudo systemd-run --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE" \
            -p PrivateNetwork=yes -p 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6' -p NoNewPrivileges=yes \
            -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            /usr/bin/env PATH="${{ runner.temp }}/next-offline-venv/bin:/usr/bin:/bin" \
            "${{ runner.temp }}/next-offline-venv/bin/python" -B \
            .github/scripts/pytest_next_offline.py --loopback \
            --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --output "${{ runner.temp }}/next-loopback-receipts"
      - name: portable source fixture cleanup receipt
        if: always()
        run: |
          "${{ runner.temp }}/next-offline-venv/bin/python" - <<'PY'
          import pathlib, stat
          root=pathlib.Path('output/r01u3-fixtures')
          assert root.is_dir(), 'portable fixture root absent'
          assert stat.S_IMODE(root.stat().st_mode)==0o700
          assert not list(root.iterdir()), 'source fixture cleanup incomplete'
          pathlib.Path('${{ runner.temp }}/next-offline-receipts/fixture-cleanup.txt').write_text('U3_PORTABLE_FIXTURE_ROOT_EMPTY_MODE_0700\nNO_USERS_MAPPING\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: next-offline-receipts-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/next-offline-receipts/*
            ${{ runner.temp }}/next-loopback-receipts/*
          if-no-files-found: error
          retention-days: 7
