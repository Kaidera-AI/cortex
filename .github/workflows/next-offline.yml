name: next-offline
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
jobs:
  next-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: hashed API and offline-test dependencies
        run: |
          python -m venv "${{ runner.temp }}/next-offline-venv"
          systemd-run --user --scope -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            "${{ runner.temp }}/next-offline-venv/bin/python" -m pip install \
            --only-binary=:all: --require-hashes -r packages/api/requirements.lock \
            -r .github/next-offline-requirements.lock
      - name: frozen inventory and outcome oracles
        run: |
          "${{ runner.temp }}/next-offline-venv/bin/python" -B .github/scripts/tests/test_next_offline_gate.py
      - name: every admitted next suite without IP networking or native services
        run: |
          sudo systemd-run --wait --pipe --collect \
            -p User="$(id -un)" -p Group="$(id -gn)" \
            -p WorkingDirectory="$GITHUB_WORKSPACE" \
            -p PrivateNetwork=yes -p RestrictAddressFamilies=AF_UNIX -p NoNewPrivileges=yes \
            -p MemoryMax=1G -p MemorySwapMax=0 -p CPUQuota=200% \
            /usr/bin/env PATH="${{ runner.temp }}/next-offline-venv/bin:/usr/bin:/bin" \
            "${{ runner.temp }}/next-offline-venv/bin/python" -B \
            .github/scripts/pytest_next_offline.py --output "${{ runner.temp }}/next-offline-receipts" --force-skip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: next-offline-receipts
          path: ${{ runner.temp }}/next-offline-receipts/*
          if-no-files-found: error
          retention-days: 7
