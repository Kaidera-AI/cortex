name: Cortex Linux x86_64 TEST package

# After Vera passes the frozen SHA, create this exact SHA-named branch. The
# normal source-review branch never starts an image build or install.
on:
  push:
    branches: ["ren-cx/linux-package-build-admitted-*"]
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  LC_ALL: C

permissions:
  contents: read

concurrency:
  group: cortex-linux-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository == 'Kaidera-AI/cortex' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_REF" = "ren-cx/linux-package-build-admitted-$CANDIDATE_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = x86_64
          echo "version=0.2.001-test.$(date -u +%Y%m%d).$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

  images:
    needs: identity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fresh job-owned rootless storage; inherited store is untouched
        run: >-
          python3 scripts/release/linux_ci_storage.py
          --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Current Linuxbrew Podman (Homebrew verifies the bottle checksum)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
          brew update
          brew install podman --force-bottle
          if test -n "$(brew outdated podman)"; then brew upgrade podman --force-bottle; fi
          brew install crun --force-bottle
          if test -n "$(brew outdated crun)"; then brew upgrade crun --force-bottle; fi
          test "$(command -v podman)" = /home/linuxbrew/.linuxbrew/bin/podman
          brew info --json=v2 podman
          brew info --json=v2 crun
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
      - name: Bind current stock Linuxbrew crun for Podman and Buildah
        run: >-
          python3 scripts/release/linux_ci_runtime.py
          --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - name: Observe local engine using the bound runtime and fresh storage
        run: podman --remote=false version
      - name: Build immutable OCI images and package inventory
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
        run: >-
          python3 scripts/release/linux_ci_diagnostics.py --target linux-x86_64
          --source-sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION"
          --output "$RUNNER_TEMP/cortex-images"
          --diagnostics-output "$RUNNER_TEMP/cortex-linux-diagnostics"
      - name: Retain public engine and startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-linux-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/cortex-linux-diagnostics
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-linux-images-${{ github.sha }}
          path: ${{ runner.temp }}/cortex-images
          if-no-files-found: error
          retention-days: 14

  host:
    needs: identity
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native compiler and standard library headers
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential curl ca-certificates binutils perl pkg-config
          zlib1g-dev libbz2-dev liblzma-dev libffi-dev libsqlite3-dev uuid-dev
      - name: Compile pinned native runtime; no global or Homebrew install
        run: >-
          python3 scripts/release/bootstrap-linux-runtime.py
          --output "$RUNNER_TEMP/cortex-native-runtime"
      - name: Freeze native installer; no target Python dependency
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
          LD_LIBRARY_PATH: ${{ runner.temp }}/cortex-native-runtime/openssl/lib:${{ runner.temp }}/cortex-native-runtime/python/lib
        run: >-
          "$RUNNER_TEMP/cortex-native-runtime/venv/bin/python" scripts/release/build-candidate.py host --target linux-x86_64
          --source-sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION"
          --runtime "$RUNNER_TEMP/cortex-native-runtime"
          --output "$RUNNER_TEMP/cortex-host"
      - name: Qualify both bundled OpenSSL closures and actual loaded libraries
        run: >-
          "$RUNNER_TEMP/cortex-native-runtime/venv/bin/python" scripts/release/linux_runtime_closure.py
          --runtime "$RUNNER_TEMP/cortex-native-runtime"
          --binary "$RUNNER_TEMP/cortex-host/bin/cortex-test"
          --binary "$RUNNER_TEMP/cortex-host/bin/cortex-agent"
          --output "$RUNNER_TEMP/cortex-host/openssl-closure.json"
      - name: Retain refused binary bytes as CI evidence only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-linux-refused-binaries-${{ github.sha }}
          path: ${{ runner.temp }}/cortex-host/bin
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-linux-host-${{ github.sha }}
          path: ${{ runner.temp }}/cortex-host
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [identity, images, host]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cortex-linux-images-${{ github.sha }}
          path: ${{ runner.temp }}/cortex-images
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cortex-linux-host-${{ github.sha }}
          path: ${{ runner.temp }}/cortex-host
      - name: Assemble exact builder bytes; do not rebuild
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ needs.identity.outputs.version }}
        run: >-
          python3 scripts/release/build-candidate.py assemble --target linux-x86_64
          --source-sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION"
          --images "$RUNNER_TEMP/cortex-images" --host "$RUNNER_TEMP/cortex-host"
          --output "$RUNNER_TEMP/cortex-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-linux-x86_64-${{ needs.identity.outputs.version }}
          path: |
            ${{ runner.temp }}/cortex-package/*.tar.gz
            ${{ runner.temp }}/cortex-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
